name: Kittygram CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kittygram_ci
          POSTGRES_USER: kittygram_ci
          POSTGRES_PASSWORD: kittygram_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kittygram_ci -d kittygram_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: kittygram_ci
      POSTGRES_USER: kittygram_ci
      POSTGRES_PASSWORD: kittygram_ci
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      SECRET_KEY: ci-test-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies and Ruff
        run: pip install -r backend/requirements.txt ruff

      - name: Check backend with Ruff
        run: ruff check backend

      - name: Run backend tests
        run: python backend/manage.py test cats

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        working-directory: frontend
        env:
          CI: "true"

  build-and-push:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:${{ github.sha }}

      - name: Build and push gateway
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:${{ github.sha }}

  notify:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=Kittygram: тесты пройдены, образы опубликованы на Docker Hub. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"